name: E2E staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  browser-test:
    name: Probar registro y reservas en staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      E2E_BASE_URL: ${{ vars.RENDER_STAGING_FRONTEND_URL }}
    steps:
      - name: Verificar URL de staging
        shell: bash
        run: |
          if [[ -z "$E2E_BASE_URL" ]]; then
            echo 'Falta la variable RENDER_STAGING_FRONTEND_URL en el entorno staging'
            exit 1
          fi
          if [[ "$E2E_BASE_URL" != https://* ]]; then
            echo 'La URL de staging debe usar HTTPS'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Ejecutar pruebas en staging
        run: npm run test:e2e
        working-directory: frontend
      - name: Guardar resultados E2E
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
