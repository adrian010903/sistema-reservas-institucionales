name: CD desarrollo (Render)

# Se ejecuta cuando termina en main cualquiera de los checks requeridos
# (CI, Docker o E2E). Solo despliega cuando los tres terminaron con éxito
# para el mismo commit; así nunca corre en paralelo con ellos.
on:
  workflow_run:
    workflows: [CI, Docker, E2E]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# Si llegan dos merges seguidos, se despliegan en orden y nunca a la vez.
concurrency:
  group: render-development
  cancel-in-progress: false

jobs:
  checks:
    name: Esperar checks requeridos
    # Solo continúa si el check que terminó salió bien y fue por un push
    # a main (un merge), no por un Pull Request.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      listo: ${{ steps.revision.outputs.listo }}
    steps:
      - name: Checkout del commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Comprobar CI, Docker y E2E
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set +e
          bash .github/scripts/checks.sh "$COMMIT"
          codigo=$?
          set -e
          case "$codigo" in
            0) echo 'Todos los checks pasaron: se despliega'
               echo 'listo=true' >> "$GITHUB_OUTPUT" ;;
            2) echo 'Faltan checks por terminar; el último que termine iniciará el despliegue'
               echo 'listo=false' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Algún check falló; no se despliega'
               exit 1 ;;
          esac

  deploy:
    name: Desplegar desarrollo
    needs: checks
    if: needs.checks.outputs.listo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: development
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      BACKEND_SERVICE_ID: ${{ vars.RENDER_DEV_BACKEND_SERVICE_ID }}
      FRONTEND_SERVICE_ID: ${{ vars.RENDER_DEV_FRONTEND_SERVICE_ID }}
      BACKEND_URL: ${{ vars.RENDER_DEV_BACKEND_URL }}
      FRONTEND_URL: ${{ vars.RENDER_DEV_FRONTEND_URL }}
      # El commit exacto que pasó los checks.
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout del commit aprobado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verificar configuración de desarrollo
        shell: bash
        run: |
          bash .github/scripts/validar-config.sh development
          # Los nombres exactos garantizan que desarrollo no use
          # los servicios de staging ni los de producción.
          bash .github/scripts/render.sh verificar "$BACKEND_SERVICE_ID" "$BACKEND_URL" '^reservas-backend-dev$'
          bash .github/scripts/render.sh verificar "$FRONTEND_SERVICE_ID" "$FRONTEND_URL" '^reservas-frontend-dev$'

      - name: Desplegar backend y frontend
        shell: bash
        run: |
          # Si dos checks terminaron a la vez, la segunda ejecución encuentra
          # el commit ya live y no lo vuelve a desplegar.
          bash .github/scripts/render.sh desplegar_si_falta "$BACKEND_SERVICE_ID" backend "$COMMIT"
          bash .github/scripts/render.sh salud "${BACKEND_URL%/}/api/v1/status"
          bash .github/scripts/render.sh desplegar_si_falta "$FRONTEND_SERVICE_ID" frontend "$COMMIT"
          bash .github/scripts/render.sh salud "${FRONTEND_URL%/}/login"
          echo "Desarrollo actualizado al commit $COMMIT"
